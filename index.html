<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>VIP CONTENT · Premium Digital Content</title>
    <link rel="stylesheet" href="css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            max-width: 100%;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #7c3aed;
            border-radius: 2px;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(124, 58, 237, 0.15);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            background: linear-gradient(135deg, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-actions .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(124, 58, 237, 0.1);
            border-radius: 8px;
            padding: 0 12px;
            transition: border-color 0.3s;
        }

        .header-actions .search-box:focus-within {
            border-color: #7c3aed;
        }

        .header-actions .search-box input {
            background: none;
            border: none;
            color: #fff;
            padding: 8px 8px 8px 4px;
            font-size: 13px;
            outline: none;
            width: 120px;
        }

        .header-actions .search-box input::placeholder {
            color: #6b7280;
        }

        .header-actions .search-box i {
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .header-actions .search-box input {
                width: 80px;
                font-size: 12px;
            }
            .header-actions .search-box {
                padding: 0 8px;
            }
        }

        /* HERO */

        .hero {
            padding: 28px 16px 16px;
            text-align: center;
        }

        .hero h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 4px;
        }

        /* ===== PROMO BANNER COM TIMER ===== */

        .promo-banner {
            background: linear-gradient(135deg, #1a0a0a, #2a0a0a);
            border: 2px solid rgba(220, 38, 38, 0.3);
            border-radius: 16px;
            padding: 16px 20px;
            margin: 8px 12px 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .promo-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(220, 38, 38, 0.05) 0%, transparent 70%);
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        .promo-banner .promo-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fbbf24;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .promo-banner .promo-label i {
            color: #dc2626;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        .promo-banner .timer-display {
            font-size: 42px;
            font-weight: 900;
            color: #dc2626;
            letter-spacing: 3px;
            font-variant-numeric: tabular-nums;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 40px rgba(220, 38, 38, 0.2);
            line-height: 1.1;
        }

        .promo-banner .timer-display .colon {
            color: #fbbf24;
            margin: 0 2px;
        }

        .promo-banner .timer-sub {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
        }

        .promo-banner .timer-sub strong {
            color: #dc2626;
        }

        .promo-banner .timer-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .promo-banner .timer-bar .fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #dc2626, #fbbf24);
            border-radius: 10px;
            transition: width 1s linear;
        }

        @media (min-width: 640px) {
            .promo-banner {
                padding: 20px 28px;
                margin: 12px 20px 16px;
                border-radius: 20px;
            }
            .promo-banner .timer-display {
                font-size: 56px;
            }
            .promo-banner .promo-label {
                font-size: 14px;
            }
            .promo-banner .timer-sub {
                font-size: 13px;
            }
        }

        @media (min-width: 1024px) {
            .promo-banner .timer-display {
                font-size: 72px;
            }
        }

        @media (max-width: 480px) {
            .promo-banner .timer-display {
                font-size: 32px;
            }
            .promo-banner {
                padding: 12px 14px;
                margin: 6px 8px 10px;
            }
            .promo-banner .promo-label {
                font-size: 10px;
            }
        }

        /* GRID */

        .grid-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px 12px 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (min-width: 640px) {
            .grid {
                gap: 16px;
            }
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 18px;
            }
        }

        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: 1fr 1fr 1fr 1fr;
                gap: 20px;
            }
        }

        /* CARD */

        .card {
            background: #141414;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(124, 58, 237, 0.08);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.4s ease forwards;
            opacity: 0;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(124, 58, 237, 0.25);
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.08);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card.hidden {
            display: none;
        }

        /* CARD DESTAQUE */

        .card-highlight {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #141414, #1a0a2e);
            border: 2px solid rgba(124, 58, 237, 0.2);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-highlight .highlight-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-highlight .card-media {
            aspect-ratio: 21/9;
        }

        .card-highlight .card-body .title-row h3 {
            font-size: 16px;
        }

        .card-highlight .card-body .title-row h3 span {
            color: #a78bfa;
        }

        .card-highlight .card-body .price-row .current {
            font-size: 22px;
            color: #fbbf24;
        }

        @media (min-width: 640px) {
            .card-highlight .card-body .title-row h3 {
                font-size: 18px;
            }
            .card-highlight .card-body .price-row .current {
                font-size: 26px;
            }
        }

        @media (max-width: 480px) {
            .card-highlight .card-body .title-row h3 {
                font-size: 13px;
            }
            .card-highlight .card-body .price-row .current {
                font-size: 17px;
            }
            .card-highlight .highlight-badge {
                font-size: 8px;
                padding: 2px 10px;
                top: 8px;
                left: 8px;
            }
        }

        /* CARD MEDIA */

        .card-media {
            position: relative;
            aspect-ratio: 16/9;
            background: #0a0a0a;
            overflow: hidden;
            cursor: pointer;
        }

        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover .card-media img {
            transform: scale(1.03);
        }

        .card-media .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            transition: background 0.3s;
        }

        .card-media .play-overlay i {
            font-size: 40px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s;
        }

        .card-media:hover .play-overlay i {
            transform: scale(1.08);
            color: #a78bfa;
        }

        .card-media .badge-stock {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            color: #fbbf24;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            z-index: 2;
            border: 1px solid rgba(251, 191, 36, 0.15);
        }

        /* CARD BODY */

        .card-body {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-body .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
        }

        .card-body .title-row h3 {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        .card-body .title-row .discount-text {
            font-size: 11px;
            font-weight: 800;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.12);
            padding: 2px 8px;
            border-radius: 12px;
            white-space: nowrap;
            border: 1px solid rgba(251, 191, 36, 0.1);
        }

        .card-body .stats {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
        }

        .card-body .stats i {
            margin-right: 3px;
            color: #7c3aed;
        }

        .card-body .description {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-body .features {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-top: 6px;
        }

        .card-body .features span {
            font-size: 10px;
            color: #6b7280;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .card-body .features span i {
            color: #7c3aed;
            margin-right: 3px;
            font-size: 8px;
        }

        .card-body .price-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .card-body .price-row .original {
            font-size: 13px;
            color: #6b7280;
            text-decoration: line-through;
        }

        .card-body .price-row .current {
            font-size: 18px;
            font-weight: 800;
            color: #a78bfa;
        }

        .card-body .actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .card-body .actions .btn {
            flex: 1;
            padding: 8px 6px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            -webkit-tap-highlight-color: transparent;
        }

        .card-body .actions .btn:active {
            transform: scale(0.95);
        }

        .card-body .actions .btn-preview {
            background: rgba(255, 255, 255, 0.06);
            color: #d1d5db;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card-body .actions .btn-preview:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .card-body .actions .btn-buy {
            background: linear-gradient(135deg, #229ED9, #229ED9);
            color: #fff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.2
